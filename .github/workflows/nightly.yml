name: Nightly Build

on:
  schedule:
    # 00:00 Asia/Taipei (16:00 UTC), on the default branch.
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      should-build: ${{ steps.changes.outputs.should-build }}
    steps:
      - name: Check for changes since the last successful nightly
        id: changes
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              core.setOutput('should-build', 'true');
              await core.summary.addRaw('Manual run: build requested.').write();
              return;
            }

            const { data } = await github.rest.actions.listWorkflowRuns({
              ...context.repo,
              workflow_id: 'nightly.yml',
              branch: context.ref.replace(/^refs\/heads\//, ''),
              status: 'success',
              per_page: 10,
            });
            const previous = data.workflow_runs.find(run => run.id !== context.runId);
            // Successful skipped runs retain the same SHA, so they are valid baselines too.
            const shouldBuild = !previous || previous.head_sha !== context.sha;
            core.setOutput('should-build', String(shouldBuild));
            await core.summary.addRaw(shouldBuild
              ? 'New commit or no successful baseline: build required.'
              : 'No new commits since the last successful nightly: build skipped.').write();

  build:
    needs: check-changes
    if: needs.check-changes.outputs.should-build == 'true'
    uses: ./.github/workflows/build-plugin.yml
