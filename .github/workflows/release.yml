name: Build and Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Plugin version without v (for example: 0.1.0 or 0.2.0-beta.1)'
        required: true
        type: string
      prerelease:
        description: Mark as a pre-release
        type: boolean
        default: false
      draft:
        description: Keep the release as a draft
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-plugin.yml
    with:
      version: ${{ inputs.version }}

  release:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: codei18n-idea-${{ inputs.version }}
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
          DRAFT: ${{ inputs.draft }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if git show-ref --verify --quiet "refs/tags/$tag"; then
            echo "::error::Tag $tag already exists. Choose a new version."
            exit 1
          fi
          flags=()
          if [[ "$PRERELEASE" == true || "$VERSION" == *-* ]]; then
            flags+=(--prerelease)
          fi
          # Upload assets to a draft before making the release public.
          gh release create "$tag" "dist/codei18n-idea-$VERSION.zip" \
            --target "$GITHUB_SHA" --title "$tag" --generate-notes --draft "${flags[@]}"
          if [[ "$DRAFT" != true ]]; then
            gh release edit "$tag" --draft=false
          fi
